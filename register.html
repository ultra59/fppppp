<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-left">
        <h1 class="auth-title">Создайте аккаунт</h1>
        <p class="auth-subtitle">Уже есть аккаунт? <a href="login.html">Войти</a></p>

        <div class="auth-tabs">
            <a class="auth-tab" href="login.html">Войти</a>
            <a class="auth-tab active">Создать аккаунт</a>
        </div>

        <form class="auth-form">
            <label>Имя</label>
            <input type="text" placeholder="Ваше имя">

            <label>Почта</label>
            <input type="email" placeholder="example@gmail.com">

            <label>Пароль</label>
            <input type="password" placeholder="Введите пароль">

            <label>Повторить пароль</label>
            <input type="password" placeholder="Повторите пароль">

            <div class="auth-remember">
                <input type="checkbox" id="remember">
                <label for="remember">Запомнить меня</label>
            </div>

            <button class="auth-btn">Зарегистрироваться</button>
        </form>
    </div>

    <div class="auth-right">
        <div class="auth-illustration"></div>
        <h2 class="auth-slogan">Контролируй финансы — достигай целей</h2>
        <p class="auth-desc">Удобный учет, аналитика и контроль твоих средств в одном месте.</p>
    </div>
</div>

</body>
</html>
